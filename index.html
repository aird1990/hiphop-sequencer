<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HipHop Sequencer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto+Mono:wght@400;700&display=swap');

        :root {
            --bling-gold: #ffd700;
            --bling-dark: #b8860b;
            --street-concrete: #333;
            --pad-grey: #2a2a2a;
            --bg-dark: #0a0a0a;
            --panel-bg: #1a1a1a;
            --grid-bg: #050505;
        }

        body {
            background-color: var(--bg-dark);
            color: #eee;
            font-family: 'Roboto Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--bling-gold); }

        h1 {
            font-family: 'Black Ops One', cursive;
            font-size: 3rem;
            letter-spacing: 2px;
            background: linear-gradient(to bottom, #fff, var(--bling-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.2;
        }

        .sequencer-container {
            background: var(--panel-bg);
            border: 4px solid var(--street-concrete);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            width: 100%;
            max-width: 1000px;
            border-bottom: 8px solid #000;
        }

        /* Controls */
        .btn {
            background: linear-gradient(to bottom, #444, #222);
            border: 1px solid #555;
            color: #ddd;
            padding: 8px 16px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            box-shadow: 0 2px 0 #000;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.1s;
        }

        .btn:active { box-shadow: 0 1px 0 #000; transform: translateY(1px); }
        .btn.active {
            background: linear-gradient(to bottom, var(--bling-gold), var(--bling-dark));
            color: #000;
            border-color: var(--bling-gold);
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }

        .btn-gold { border-color: var(--bling-gold); color: var(--bling-gold); }
        .btn-gold:hover { background: var(--bling-gold); color: #000; box-shadow: 0 0 10px var(--bling-gold); }
        .btn-danger { background: linear-gradient(to bottom, #800, #500); color: #ffcccc; border-color: #900; }

        .bar-btn {
            border-color: #444;
            color: #888;
            background: #000;
            min-width: 32px;
            padding: 6px 10px;
        }
        .bar-btn.current {
            border-color: var(--bling-gold);
            background: var(--bling-gold);
            color: #000;
            box-shadow: 0 0 15px var(--bling-gold);
        }

        select {
            background: #000;
            color: var(--bling-gold);
            border: 1px solid var(--bling-dark);
            padding: 8px;
            border-radius: 4px;
            outline: none;
        }

        input[type="range"] { accent-color: var(--bling-gold); cursor: pointer; }

        .grid-wrapper {
            background: var(--grid-bg);
            border: 2px solid #222;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .grid-scroll-area {
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 10px;
        }

        .grid-fixed-width { min-width: 680px; }

        .grid-row {
            display: grid;
            /* Layout Adjustment: Reduced first column width from 90px to 70px */
            grid-template-columns: 70px repeat(16, 1fr);
            gap: 4px;
            margin-bottom: 8px;
            align-items: center;
            min-height: 44px;
        }

        .track-label {
            font-weight: bold;
            color: #666;
            font-size: 0.85em;
            text-transform: uppercase;
            /* Layout Fix: Right align text and add padding to close the gap */
            text-align: right;
            padding-right: 12px;
        }

        .step {
            aspect-ratio: 1;
            background: #1a1a1a;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
            border: 1px solid #333;
            transition: all 0.1s;
            box-sizing: border-box;
        }
        .step.hidden-step { display: none; }

        .step:not(.hidden-step):nth-of-type(4n + 2) {
            border-left: 2px solid #555;
        }

        .step:hover { background: #333; }

        /* --- NOTE COLORS (Neon Look) --- */
        #row-0 .step.active { 
            background: #bf80ff !important; 
            box-shadow: 0 0 15px #bf80ff, inset 0 0 5px #fff !important;
            border-color: #fff !important;
        }
        #row-1 .step.active { 
            background: #00ccff !important; 
            box-shadow: 0 0 15px #00ccff, inset 0 0 5px #fff !important;
            border-color: #fff !important;
        }
        #row-2 .step.active { 
            background: #ffd700 !important; 
            box-shadow: 0 0 20px #ffd700, inset 0 0 5px #fff !important;
            border-color: #fff !important;
        }
        #row-3 .step.active { 
            background: #ff3333 !important; 
            box-shadow: 0 0 20px #ff3333, inset 0 0 5px #fff !important;
            border-color: #fff !important;
        }

        .step.playing {
            filter: brightness(2.0) saturate(1.2);
            transform: scale(1.1);
            z-index: 10;
            border: 2px solid #fff !important;
        }

        .indicator {
            height: 6px;
            background: #111;
            border-radius: 2px;
            margin-bottom: 4px;
        }
        .indicator.hidden-step { display: none; }
        .indicator.head-active {
            background: #fff;
            box-shadow: 0 0 10px #fff;
        }

        .bpm-display {
            font-family: 'Black Ops One', cursive;
            color: var(--bling-gold);
            font-size: 1.2rem;
        }
        
        .description {
            margin-top: 15px;
            font-size: 0.85em;
            color: #555;
            text-align: center;
            font-style: italic;
        }

        @media (max-width: 640px) {
            h1 { font-size: 2rem; }
            /* Responsive adjust: 50px width for mobile */
            .grid-row { grid-template-columns: 50px repeat(16, 1fr); }
            .track-label { font-size: 0.7rem; padding-right: 6px; }
        }
    </style>
</head>
<body>

    <h1>HipHop Sequencer</h1>

    <div class="sequencer-container">
        <!-- Controls -->
        <div class="flex flex-col gap-6 mb-6">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex gap-2 flex-wrap">
                    <button id="playBtn" class="btn">▶ PLAY</button>
                    <button id="stopBtn" class="btn">■ STOP</button>
                    <button id="clearBtn" class="btn btn-danger">CLEAR</button>
                </div>
                
                <div class="flex flex-wrap gap-4 items-center flex-grow justify-center sm:justify-end">
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-gray-500 font-bold">BPM</span>
                        <input type="range" id="bpmSlider" min="70" max="110" value="90" class="w-24 sm:w-32">
                        <span id="bpmVal" class="bpm-display w-8 text-right">90</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-gray-500 font-bold">VOL</span>
                        <input type="range" id="volSlider" min="0" max="100" value="80" class="w-20 sm:w-24">
                        <span id="volVal" class="text-gray-400 text-xs w-8 text-right">80%</span>
                    </div>
                </div>

                <button id="exportBtn" class="btn btn-gold">MIDI ↓</button>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-4 bg-black/40 p-3 rounded border border-gray-800">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-gray-500 font-bold mr-1">BAR:</span>
                    <button class="btn bar-btn current" data-bar="0">1</button>
                    <button class="btn bar-btn" data-bar="1">2</button>
                    <button class="btn bar-btn" data-bar="2">3</button>
                    <button class="btn bar-btn" data-bar="3">4</button>
                    
                    <div class="h-6 w-px bg-gray-700 mx-2"></div>
                    
                    <label class="flex items-center cursor-pointer gap-2">
                        <input type="checkbox" id="autoFollowCheck" checked class="accent-[#ffd700]">
                        <span class="text-xs text-gray-400 select-none font-bold">AUTO</span>
                    </label>
                </div>

                <select id="presetSelect" class="w-full sm:w-64 text-sm">
                    <option value="" disabled selected>SELECT STYLE...</option>
                </select>
            </div>
        </div>

        <div class="text-center mb-4">
            <div id="patternName" class="text-yellow-500 font-bold text-lg tracking-wide uppercase font-[Black Ops One]">MANUAL MODE</div>
            <div id="descDisplay" class="text-gray-600 text-xs mt-1 h-4">System Online.</div>
        </div>

        <div class="grid-wrapper">
            <div class="grid-scroll-area">
                <div class="grid-fixed-width" id="grid-root">
                    <div class="grid-row mb-2" id="indicators-row">
                        <div></div>
                    </div>
                    <div class="grid-row" id="row-0"></div>
                    <div class="grid-row" id="row-1"></div>
                    <div class="grid-row" id="row-2"></div>
                    <div class="grid-row" id="row-3"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="description">
        808 Synthesis // 4-Bar Expansion // Layout Fixed
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let masterGainNode;
        let masterVolume = 0.8;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
                masterGainNode = audioCtx.createGain();
                masterGainNode.gain.value = masterVolume;
                masterGainNode.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playKick(time) {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.connect(g); g.connect(masterGainNode);
            osc.frequency.setValueAtTime(150, time);
            osc.frequency.exponentialRampToValueAtTime(40, time + 0.1); 
            g.gain.setValueAtTime(1.0, time);
            g.gain.exponentialRampToValueAtTime(0.01, time + 0.6);
            osc.start(time); osc.stop(time + 0.6);
        }

        function playSnare(time) {
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass'; filter.frequency.value = 1000;
            const g = audioCtx.createGain();
            noise.connect(filter); filter.connect(g); g.connect(masterGainNode);
            g.gain.setValueAtTime(0.7, time);
            g.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
            noise.start(time); noise.stop(time + 0.2);
        }

        function playHiHat(time, open = false) {
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass'; filter.frequency.value = 8000;
            const g = audioCtx.createGain();
            noise.connect(filter); filter.connect(g); g.connect(masterGainNode);
            const decay = open ? 0.4 : 0.05;
            g.gain.setValueAtTime(open ? 0.5 : 0.3, time);
            g.gain.exponentialRampToValueAtTime(0.01, time + decay);
            noise.start(time); noise.stop(time + decay);
        }

            { name: "26. Lo-Fi House", desc: "4x4 House vibe.", k: [0, 4, 8, 12, 16, 20, 24, 28, 32, 36, 40, 44, 48, 52, 56, 60], s: [4, 12, 20, 28, 36, 44, 52, 60], ch: [2, 6, 10, 14, 18, 22, 26, 30, 34, 38, 42, 46, 50, 54, 58, 62], oh: [14, 30, 46, 62] },
            { name: "27. Glitch Hop", desc: "Randomized perc fill.", k: [0, 3, 11, 16, 21, 27, 32, 35, 43, 48, 53, 59], s: [8, 15, 24, 31, 40, 47, 56, 63], ch: [2, 5, 9, 14, 18, 25, 29, 36], oh: [0, 16, 32, 48] },
            { name: "28. Jazz Hop Swing", desc: "Heavy swing feel.", k: [0, 3, 8, 11, 16, 19, 24, 27, 32, 35, 40, 43, 48, 51, 56, 59], s: [4, 12, 20, 28, 36, 44, 52, 60], ch: [0, 2, 4, 6, 8, 10, 12, 14], oh: [14, 30, 46, 62] },
            { name: "29. Broken Kick", desc: "Non-linear patterns.", k: [0, 3, 7, 10, 14, 16, 19, 23, 26, 30, 32, 35, 39, 42, 46, 48, 51, 55, 58, 62], s: [4, 12, 20, 28, 36, 44, 52, 60], ch: [0, 4, 8, 12], oh: [14, 30, 46, 62] },
            { name: "30. Old School Funk", desc: "Funky loop fill.", k: [0, 3, 7, 10, 14, 16, 19, 23, 26, 30, 32, 35, 39, 42, 46, 48, 51, 55, 58, 62], s: [4, 12, 20, 28, 36, 44, 52, 60], ch: [2, 6, 10, 14], oh: [0, 16, 32, 48] }
        ];

        function createGrid() {
            const indRow = document.getElementById('indicators-row');
            indRow.innerHTML = '<div></div>'; 
            for(let i=0; i<STEPS; i++) {
                const div = document.createElement('div');
                div.className = 'indicator';
                div.id = `ind-${i}`;
                div.dataset.bar = Math.floor(i / 16);
                if (div.dataset.bar != currentBarView) div.classList.add('hidden-step');
                indRow.appendChild(div);
            }

            const rows = ['openhat', 'hihat', 'snare', 'kick'];
            rows.forEach((rowName, rowIndex) => {
                const container = document.getElementById(`row-${rowIndex}`);
                container.innerHTML = `<div class="track-label">${rowName.toUpperCase().replace('OPENHAT','OH').replace('HIHAT','CH')}</div>`;
                for (let i = 0; i < STEPS; i++) {
                    const btn = document.createElement('div');
                    btn.className = `step row-${rowIndex}`; 
                    btn.id = `step-${rowIndex}-${i}`;
                    btn.dataset.bar = Math.floor(i / 16);
                    if (Math.floor(i / 16) != currentBarView) btn.classList.add('hidden-step');
                    btn.onclick = () => {
                        gridState[rowIndex][i] = !gridState[rowIndex][i];
                        btn.classList.toggle('active', gridState[rowIndex][i]);
                    };
                    container.appendChild(btn);
                }
            });
        }

        function updateGridUI() {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < STEPS; c++) {
                    const el = document.getElementById(`step-${r}-${c}`);
                    if(el) {
                        if(gridState[r][c]) el.classList.add('active');
                        else el.classList.remove('active');
                    }
                }
            }
        }

        function switchBarView(barIdx) {
            currentBarView = parseInt(barIdx);
            document.querySelectorAll('.bar-btn').forEach(btn => btn.classList.toggle('current', parseInt(btn.dataset.bar) === currentBarView));
            document.querySelectorAll('.step, .indicator').forEach(el => {
                if (el.dataset.bar == currentBarView) el.classList.remove('hidden-step');
                else el.classList.add('hidden-step');
            });
        }

        function scheduleNote(step, time) {
            setTimeout(() => {
                if (!isPlaying) return;
                requestAnimationFrame(() => {
                    const stepBar = Math.floor(step / 16);
                    if (autoFollow && stepBar !== currentBarView) switchBarView(stepBar);
                    
                    document.querySelectorAll('.indicator.head-active').forEach(el => el.classList.remove('head-active'));
                    document.querySelectorAll('.step.playing').forEach(el => el.classList.remove('playing'));
                    
                    const ind = document.getElementById(`ind-${step}`);
                    if (ind) ind.classList.add('head-active');
                    
                    for (let r = 0; r < 4; r++) {
                        const el = document.getElementById(`step-${r}-${step}`);
                        if(el && gridState[r][step]) el.classList.add('playing');
                    }
                });
            }, (time - audioCtx.currentTime) * 1000);

            if (gridState[0][step]) playHiHat(time, true);
            if (gridState[1][step]) playHiHat(time, false);
            if (gridState[2][step]) playSnare(time);
            if (gridState[3][step]) playKick(time);
        }

        function scheduler() {
            while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
                scheduleNote(currentStep, nextNoteTime);
                nextNoteTime += (60.0 / bpm) / 4; 
                currentStep = (currentStep + 1) % STEPS;
            }
            if (isPlaying) timerID = setTimeout(scheduler, lookahead);
        }

        async function exportMIDI() {
            initAudio();
            document.getElementById('descDisplay').innerText = "GENERATING MIDI...";
            const writeString = (view, offset, string) => {
                for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
            };
            const writeVarInt = (data, val) => {
                let buffer = val & 0x7F;
                while ((val >>= 7)) { buffer <<= 8; buffer |= ((val & 0x7F) | 0x80); }
                while (true) { data.push(buffer & 0xFF); if (buffer & 0x80) buffer >>= 8; else break; }
            };
            const PPQ = 480;
            const stepTicks = 120;
            let events = [];
            const noteMap = { 3: 36, 2: 38, 1: 42, 0: 46 };
            for (let step = 0; step < STEPS; step++) {
                const tick = step * stepTicks;
                for (let row = 0; row < 4; row++) {
                    if (gridState[row][step]) {
                        const note = noteMap[row];
                        events.push({ tick: tick, type: 0x90, note: note, velocity: 100 });
                        events.push({ tick: tick + 60, type: 0x80, note: note, velocity: 0 });
                    }
                }
            }
            events.sort((a, b) => a.tick - b.tick);
            let trackData = [];
            let lastTick = 0;
            events.forEach(e => {
                const delta = e.tick - lastTick;
                writeVarInt(trackData, delta);
                trackData.push(e.type | 0x09); trackData.push(e.note); trackData.push(e.velocity);
                lastTick = e.tick;
            });
            writeVarInt(trackData, 0); trackData.push(0xFF, 0x2F, 0x00);
            const totalSize = 14 + 8 + trackData.length;
            const buffer = new ArrayBuffer(totalSize);
            const view = new DataView(buffer);
            writeString(view, 0, 'MThd'); view.setUint32(4, 6); view.setUint16(8, 0); view.setUint16(10, 1); view.setUint16(12, PPQ);
            writeString(view, 14, 'MTrk'); view.setUint32(18, trackData.length);
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < trackData.length; i++) bytes[22 + i] = trackData[i];
            const blob = new Blob([bytes], { type: 'audio/midi' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none'; a.href = url; a.download = `hiphop_beat_${Date.now()}.mid`;
            document.body.appendChild(a); a.click();
            setTimeout(() => {
                document.body.removeChild(a); URL.revokeObjectURL(url);
                document.getElementById('descDisplay').innerText = "DOWNLOADED!";
                setTimeout(() => { document.getElementById('descDisplay').innerText = "System Online."; }, 2000);
            }, 100);
        }

        window.addEventListener('load', () => {
            createGrid();
            document.querySelectorAll('.bar-btn').forEach(btn => btn.onclick = (e) => switchBarView(e.target.dataset.bar));
            document.getElementById('autoFollowCheck').onchange = (e) => autoFollow = e.target.checked;
            const sel = document.getElementById('presetSelect');
            presets.forEach((p, i) => {
                const opt = document.createElement('option');
                opt.value = i; opt.innerText = p.name; sel.appendChild(opt);
            });
            sel.onchange = (e) => {
                const p = presets[e.target.value];
                gridState = [new Array(STEPS).fill(false), new Array(STEPS).fill(false), new Array(STEPS).fill(false), new Array(STEPS).fill(false)];
                if(p.oh) p.oh.forEach(s => gridState[0][s] = true);
                if(p.ch) p.ch.forEach(s => gridState[1][s] = true);
                if(p.s)  p.s.forEach(s => gridState[2][s] = true);
                if(p.k)  p.k.forEach(s => gridState[3][s] = true);
                updateGridUI();
                document.getElementById('patternName').innerText = p.name;
                document.getElementById('descDisplay').innerText = p.desc;
            };
            document.getElementById('playBtn').onclick = () => {
                if (isPlaying) return;
                initAudio(); isPlaying = true; currentStep = 0; nextNoteTime = audioCtx.currentTime + 0.1;
                if (autoFollow) switchBarView(0);
                scheduler();
            };
            document.getElementById('stopBtn').onclick = () => {
                isPlaying = false; clearTimeout(timerID);
                // Specific removal of head/play classes, keeping 'active' notes
                document.querySelectorAll('.indicator.head-active').forEach(el => el.classList.remove('head-active'));
                document.querySelectorAll('.step.playing').forEach(el => el.classList.remove('playing'));
            };
            document.getElementById('clearBtn').onclick = () => {
                gridState = [new Array(STEPS).fill(false), new Array(STEPS).fill(false), new Array(STEPS).fill(false), new Array(STEPS).fill(false)];
                updateGridUI();
                document.getElementById('patternName').innerText = "EMPTY";
            };
            document.getElementById('bpmSlider').oninput = (e) => {
                bpm = parseInt(e.target.value);
                document.getElementById('bpmVal').innerText = bpm;
            };
            document.getElementById('volSlider').oninput = (e) => {
                masterVolume = e.target.value / 100;
                if (masterGainNode) masterGainNode.gain.setValueAtTime(masterVolume, audioCtx.currentTime);
            };
            document.getElementById('exportBtn').onclick = exportMIDI;
            sel.value = 0; sel.dispatchEvent(new Event('change'));
        });
    </script>
